// ─── TIME HELPERS ───────────────────────────────────────────────────────────── ─────────────────────────────────────────────────────────────
function minutesToTime(mins) {
  const h = Math.floor(mins/60)%24;
  const m = mins%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function timeOfDayLabel(mins) {
  const h = Math.floor(mins/60)%24;
  if(h>=5&&h<8)   return "Amanecer";
  if(h>=8&&h<12)  return "Mañana";
  if(h>=12&&h<14) return "Mediodía";
  if(h>=14&&h<18) return "Tarde";
  if(h>=18&&h<21) return "Atardecer";
  if(h>=21||h<1)  return "Noche";
  return "Madrugada";
}

// ─── CAPACITY HELPERS ─────────────────────────────────────────────────────────
function getCapacity(inventory, forceLevel) {
  // Base capacity depends on Fuerza level
  const baseKg = 8 + forceLevel * 1.5;
  const baseL  = 6 + forceLevel * 1.2;
  let extraKg = 0, extraL = 0;
  inventory.forEach(({name}) => {
    const it = getItem(name);
    if(it.isContainer){ extraKg += it.extraKg||0; extraL += it.extraL||0; }
  });
  return { maxKg: baseKg+extraKg, maxL: baseL+extraL };
}
function getUsed(inventory) {
  let kg=0, l=0;
  inventory.forEach(({name,qty=1})=>{ const it=getItem(name); kg+=it.kg*qty; l+=it.l*qty; });
  return {kg:parseFloat(kg.toFixed(2)), l:parseFloat(l.toFixed(2))};
}

// ─── SUBSTITUTE RESOLVER ─────────────────────────────────────────────────────
// Dada una receta, devuelve qué ingredientes puede satisfacer el inventario
// y si hay sustitutos, qué failChance acumula
function resolveIngredients(recipe, inventory){
  const result = recipe.ingredients.map(ing=>{
    const exact = inventory.some(i=>i.name===ing.name && (i.qty||1)>= (ing.qty||1));
    if(exact) return { ...ing, satisfied:true, usedSub:null, failChance:0 };
    // Buscar sustituto
    if(ing.substitutes){
      for(const sub of ing.substitutes){
        const hasSub = inventory.some(i=>i.name===sub.name);
        if(hasSub) return { ...ing, satisfied:true, usedSub:sub.name, failChance:sub.failChance };
      }
    }
    return { ...ing, satisfied:false, usedSub:null, failChance:0 };
  });
  const allSatisfied = result.every(r=>r.satisfied);
  const totalFailChance = result.reduce((s,r)=>s+(r.failChance||0), 0);
  return { resolved:result, allSatisfied, totalFailChance };
}

// ─── REESCRITURA DE NARRATIVA CON ESTILO ─────────────────────────────────────
async function rewriteNarrative(rawNarrative, narratorStyle, charName, gameDay){
  console.log("[NARRATOR] rewriteNarrative called — style:", narratorStyle);
  if(narratorStyle === "cronista") return rawNarrative;
  const styleDef = NARRATOR_STYLES[narratorStyle];
  if(!styleDef){ console.warn("[NARRATOR] styleDef not found for:", narratorStyle); return rawNarrative; }
  try {
    console.log("[NARRATOR] Calling Groq for rewrite...");
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
      body: JSON.stringify({
        model: GROQ_MODEL,
        temperature: 0.9,
        max_tokens: 600,
        messages: [
          {
            role: "system",
            content:
              "Eres un reescritor de texto narrativo. Tu única tarea es reescribir el texto que te den aplicando estrictamente el siguiente estilo de voz:\n\n"+
              styleDef.prompt+"\n\n"+
              "El personaje se llama "+charName+". Día de juego: "+gameDay+".\n"+
              "REGLAS ESTRICTAS:\n"+
              "- Mantén TODOS los hechos y eventos del texto original. No añadas ni elimines eventos.\n"+
              "- Solo cambia el ESTILO y la VOZ, no el contenido.\n"+
              "- Responde ÚNICAMENTE con el texto reescrito, sin explicaciones ni comillas envolventes."
          },
          { role: "user", content: rawNarrative }
        ],
      }),
    });
    console.log("[NARRATOR] Groq response status:", res.status);
    if(!res.ok){ console.warn("[NARRATOR] Groq error:", res.status); return rawNarrative; }
    const data = await res.json();
    const rewritten = data?.choices?.[0]?.message?.content?.trim();
    console.log("[NARRATOR] Rewrite result:", rewritten?.substring(0,80));
    return rewritten || rawNarrative;
  } catch(e) {
    console.error("[NARRATOR] rewriteNarrative error:", e);
    return rawNarrative;
  }
}

// ─── API CALL ─────────────────────────────────────────────────────────────────
async function callClaude(messages, charName, charClass, skillXpMap, traitNames, inventory, needs, weather, injuries=[], mapData={nodes:{},currentZone:""}, base=BASE_INITIAL, knownRecipes=[], narratorStyle="cronista", gameDay=1) {
  const skillLevels = Object.fromEntries(Object.entries(skillXpMap).map(([k,v])=>[k,xpToLvl(v)]));
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${GROQ_API_KEY}`,
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        temperature: 1,
        max_tokens: 1024,
        top_p: 1,
        stream: false,
        messages: [
          { role: "system", content: SYSTEM_PROMPT(charName, charClass, skillLevels, traitNames, inventory, needs, weather, injuries, mapData, base, knownRecipes, narratorStyle, gameDay) },
          ...messages,
        ],
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      console.error("Groq API error", res.status, errText);
      return {
        narrative: "Error al generar la respuesta del modelo.",
        hpChange: 0,
        itemsGained: [],
        itemsLost: [],
        skillXp: {},
        timeMinutes: 10,
        hungerChange: -3,
        thirstChange: -5,
        sleepChange: -2,
        tempChange: 0,
        sceneDescription: "post-apocalyptic ruins",
        location: "Desconocido",
        craftRecipe: null
      };
    }
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content || "{}";
    try {
      const parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      // Segunda llamada para aplicar estilo narrativo
      if(narratorStyle !== "cronista" && parsed.narrative){
        console.log("[NARRATOR] Triggering rewrite for style:", narratorStyle);
        parsed.narrative = await rewriteNarrative(parsed.narrative, narratorStyle, charName, gameDay);
      }
      return parsed;
    } catch (e) {
      console.error("Failed to parse Groq JSON", e);
      return {
        narrative: raw,
        hpChange: 0,
        itemsGained: [],
        itemsLost: [],
        skillXp: {},
        timeMinutes: 10,
        hungerChange: -3,
        thirstChange: -5,
        sleepChange: -2,
        tempChange: 0,
        sceneDescription: "post-apocalyptic ruins",
        location: "Desconocido",
        craftRecipe: null
      };
    }
  } catch (e) {
    console.error("Network error calling Groq", e);
    return {
      narrative: "Error de red al contactar el modelo.",
      hpChange: 0,
      itemsGained: [],
      itemsLost: [],
      skillXp: {},
      timeMinutes: 10,
      hungerChange: -3,
      thirstChange: -5,
      sleepChange: -2,
      tempChange: 0,
      sceneDescription: "post-apocalyptic ruins",
      location: "Desconocido",
      craftRecipe: null
    };
  }
}

function NeedsBar({label, value, color, icon}){
  const pct = Math.max(0,Math.min(100,value));
  const isCrit = pct<=20;
  const isWarn = pct<=40 && pct>20;
  const barCol = isCrit?"#c0392b":isWarn?"#c97c3a":color;
  return (
    <div style={{marginBottom:7}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
        <span style={{fontSize:9,color:isCrit?"#c0392b":"#6b5c3e",letterSpacing:1,
          animation:isCrit?"critPulse 1.4s ease-in-out infinite":"none"}}>{icon} {label}</span>
        <span style={{fontSize:10,fontWeight:isCrit?700:400,color:barCol,fontFamily:"'Cinzel',serif",
          textShadow:isCrit?"0 0 8px rgba(192,30,30,0.6)":"none"}}>{Math.round(pct)}</span>
      </div>
      <div style={{background:"#1a1510",height:3,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",
          background:isCrit?`linear-gradient(90deg,#8b0000,#c0392b)`:`linear-gradient(90deg,${barCol}66,${barCol})`,
          transition:"width 0.5s cubic-bezier(0.4,0,0.2,1)",
          boxShadow:isCrit?"0 0 6px #c0392b88":"none",
          animation:isCrit?"hpBeat 1.4s ease-in-out infinite":"none"}}/>
      </div>
    </div>
  );
}

function CapBar({used,max,unit,color}){
  const pct = Math.min(100,(used/max)*100);
  const c = pct>90?"#f87171":pct>70?"#fbbf24":color;
  return(
    <div style={{marginBottom:4}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6b7280",marginBottom:2}}>
        <span>{unit}</span><span style={{color:c}}>{used}/{max.toFixed(1)}{unit==="kg"?"kg":"L"}</span>
      </div>
      <div style={{background:"#1f2937",borderRadius:3,height:4,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",background:c,transition:"width 0.4s"}}/>
      </div>
    </div>
  );
}

const SEV_COLOR = { 1:"#ca8a04", 2:"#ea580c", 3:"#dc2626" };

function BodyMap({injuries}){
  const [hovered,setHovered] = React.useState(null);
  const injMap = {};
  injuries.forEach(inj=>{ injMap[inj.zone] = inj; });

  const hovInj = hovered ? injMap[hovered] : null;
  const hovZone = hovered ? INJURY_ZONES[hovered] : null;

  return(
    <div style={{position:"relative"}}>
      <svg viewBox="0 0 100 90" width="100%" style={{display:"block",maxHeight:160}}>
        {/* Body silhouette base */}
        {Object.entries(INJURY_ZONES).map(([key,z])=>{
          const inj = injMap[key];
          const fill = inj ? SEV_COLOR[inj.severity] : "#1f2937";
          const stroke = inj ? SEV_COLOR[inj.severity] : "#374151";
          const opacity = inj ? 0.85 : 0.5;
          return (
            <ellipse key={key} cx={z.cx} cy={z.cy} rx={z.rx} ry={z.ry}
              fill={fill} stroke={stroke} strokeWidth={inj?1.5:0.8} opacity={opacity}
              style={{cursor:inj?"pointer":"default",transition:"all 0.2s"}}
              onMouseEnter={()=>inj&&setHovered(key)}
              onMouseLeave={()=>setHovered(null)}
            />
          );
        })}
        {/* Neck connector */}
        <rect x="46" y="24" width="8" height="5" fill="#1f2937" stroke="#374151" strokeWidth="0.5" opacity="0.5"/>
        {/* Waist */}
        <rect x="36" y="53" width="28" height="6" fill="#1f2937" stroke="#374151" strokeWidth="0.5" opacity="0.4"/>
        {/* Pulse dot on injured zones */}
        {Object.entries(injMap).map(([key,inj])=>{
          const z = INJURY_ZONES[key];
          return <circle key={key+"dot"} cx={z.cx} cy={z.cy} r="2.5" fill={SEV_COLOR[inj.severity]} opacity="0.9"
            style={{animation:"pulse 1.5s ease-in-out infinite"}}/>;
        })}
      </svg>
      {/* Tooltip */}
      {hovInj && hovZone && (
        <div style={{position:"absolute",top:0,left:"105%",background:"#111827",border:"1px solid #374151",borderRadius:6,padding:"6px 9px",fontSize:10,whiteSpace:"nowrap",zIndex:10,minWidth:130}}>
          <div style={{color:SEV_COLOR[hovInj.severity],fontWeight:700,marginBottom:3}}>{hovZone.label} — {SEV_LABEL[hovInj.severity]}</div>
          <div style={{color:"#9ca3af",marginBottom:4,lineHeight:1.4}}>{hovInj.label}</div>
          <div style={{color:"#6b7280",fontSize:9}}>Penaliza: {hovZone.skills.slice(0,3).join(", ")}</div>
        </div>
      )}
      {injuries.length===0 && (
        <div style={{textAlign:"center",fontSize:9,color:"#374151",marginTop:2}}>Sin lesiones</div>
      )}
    </div>
  );
}



// ─── DISEASE PANEL ────────────────────────────────────────────────────────────
function DiseasePanel({diseases}){
  if(diseases.length===0) return(
    <div style={{fontSize:9,color:"#166534",background:"#0c1a0c",border:"1px solid #14532d",borderRadius:5,padding:"4px 8px",textAlign:"center"}}>
      💚 Sin enfermedades
    </div>
  );
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {diseases.map(d=>{
        const def = DISEASE_DEFS[d.id];
        if(!def) return null;
        const stg = def.stages[d.stage];
        const col = DISEASE_STAGE_COLORS[d.stage];
        const isGrave = d.stage===2;
        return(
          <div key={d.id} style={{background:isGrave?"#1a0808":"#0f0f1a",border:`1px solid ${col}55`,borderRadius:6,padding:"5px 8px",animation:isGrave?"gravePulse 1.5s ease-in-out infinite":"none"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontSize:11,color:col,fontWeight:700}}>{def.icon} {def.label}</span>
              <span style={{fontSize:9,color:col,background:col+"22",borderRadius:3,padding:"1px 5px"}}>{stg.label}</span>
            </div>
            <div style={{display:"flex",gap:3,marginBottom:3}}>
              {[0,1,2].map(i=>(
                <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<=d.stage?DISEASE_STAGE_COLORS[i]:"#1f2937",transition:"background 0.3s"}}/>
              ))}
            </div>
            <div style={{fontSize:9,color:"#6b7280",lineHeight:1.4}}>{stg.desc}</div>
            {def.cures.length>0&&(
              <div style={{fontSize:8,color:"#374151",marginTop:2}}>
                Cura: {def.cures.join(", ")}
              </div>
            )}
            {def.restCures&&d.stage===0&&(
              <div style={{fontSize:8,color:"#374151",marginTop:2}}>Cura: descanso prolongado</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── MAP MODAL ────────────────────────────────────────────────────────────────
function MapModal({mapData, accent, onClose}){
  const currentNode = mapData.nodes[mapData.currentZone];
  const initX = currentNode ? 400 - currentNode.x : 0;
  const initY = currentNode ? 300 - currentNode.y : 0;
  const [transform,setTransform] = React.useState({x:initX,y:initY,scale:1});
  const dragging = React.useRef(false);
  const lastPos = React.useRef({x:0,y:0});

  const NODE_COLORS={urban:"#6b7280",wilderness:"#4ade80",indoor:"#a78bfa",underground:"#f87171",water:"#38bdf8",unknown:"#374151"};
  const nodes = mapData.nodes;
  const nodeKeys = Object.keys(nodes);
  const hasNodes = nodeKeys.length > 0;

  function onMouseDown(e){
    dragging.current=true;
    lastPos.current={x:e.clientX,y:e.clientY};
  }
  function onMouseMove(e){
    if(!dragging.current)return;
    const dx=e.clientX-lastPos.current.x;
    const dy=e.clientY-lastPos.current.y;
    lastPos.current={x:e.clientX,y:e.clientY};
    setTransform(t=>({...t,x:t.x+dx,y:t.y+dy}));
  }
  function onMouseUp(){dragging.current=false;}
  function onWheel(e){
    e.preventDefault();
    const delta=e.deltaY>0?0.9:1.1;
    setTransform(t=>({...t,scale:Math.max(0.3,Math.min(4,t.scale*delta))}));
  }

  // Draw edges (deduplicated)
  const edges=[];
  const seen=new Set();
  nodeKeys.forEach(k=>{
    (nodes[k].connections||[]).forEach(c=>{
      const key=[k,c].sort().join("--");
      if(!seen.has(key)&&nodes[c]){
        seen.add(key);
        edges.push({from:k,to:c});
      }
    });
  });

  return(
    <div style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,0.92)",display:"flex",flexDirection:"column"}}
      onMouseMove={onMouseMove} onMouseUp={onMouseUp}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 20px",borderBottom:"1px solid #1e2130",flexShrink:0}}>
        <div style={{fontSize:14,fontWeight:700,color:accent,letterSpacing:2}}>🗺️ MAPA EXPLORADO</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:10,color:"#4b5563"}}>{nodeKeys.filter(k=>nodes[k].visited).length} zonas visitadas</span>
          <button onClick={onClose} style={{background:"transparent",border:"1px solid #374151",color:"#9ca3af",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:12}}>✕ Cerrar</button>
        </div>
      </div>
      {/* Map area */}
      <div style={{flex:1,overflow:"hidden",cursor:"grab",position:"relative"}}
        onMouseDown={onMouseDown} onWheel={onWheel}>
        {!hasNodes ? (
          <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:"#374151",fontSize:14}}>
            Aún no has explorado ninguna zona
          </div>
        ) : (
          <svg width="100%" height="100%" style={{display:"block"}}>
            <defs>
              <style>{`@keyframes svgPulse{0%,100%{r:26;opacity:0.25}50%{r:34;opacity:0.08}}`}</style>
            </defs>
            <g transform={`translate(${transform.x},${transform.y}) scale(${transform.scale})`}>
              {/* Edges */}
              {edges.map((e,i)=>{
                const f=nodes[e.from], t=nodes[e.to];
                return <line key={i} x1={f.x} y1={f.y} x2={t.x} y2={t.y} stroke="#1e2130" strokeWidth={2}/>;
              })}
              {/* Nodes */}
              {nodeKeys.map(k=>{
                const n=nodes[k];
                const isCurrent=k===mapData.currentZone;
                const color=NODE_COLORS[n.type]||"#6b7280";
                const opacity=n.visited?1:0.35;
                return(
                  <g key={k} transform={`translate(${n.x},${n.y})`} opacity={opacity}>
                    {isCurrent&&(
                      <circle cx={0} cy={0} r={26} fill={color} opacity={0.15}
                        style={{animation:"svgPulse 2s ease-in-out infinite"}}/>
                    )}
                    <circle cx={0} cy={0} r={18} fill={color} stroke={isCurrent?accent:"#0a0a0f"} strokeWidth={isCurrent?3:1}/>
                    {n.danger>=4&&<text x={0} y={-22} textAnchor="middle" fontSize={12}>☠️</text>}
                    {isCurrent&&<text x={0} y={5} textAnchor="middle" fontSize={10} fill="#000" fontWeight="bold">●</text>}
                    <text x={0} y={30} textAnchor="middle" fontSize={9} fill="#9ca3af"
                      style={{pointerEvents:"none",userSelect:"none"}}>{k}</text>
                    {n.danger>0&&n.danger<4&&(
                      <text x={0} y={-24} textAnchor="middle" fontSize={8} fill="#f87171">{"⚠".repeat(Math.max(1,n.danger-1))}</text>
                    )}
                  </g>
                );
              })}
            </g>
          </svg>
        )}
      </div>
      {/* Legend */}
      <div style={{display:"flex",gap:16,padding:"10px 20px",borderTop:"1px solid #1e2130",flexWrap:"wrap",flexShrink:0}}>
        {Object.entries({urban:"Urbano",wilderness:"Naturaleza",indoor:"Interior",underground:"Subterráneo",water:"Agua",unknown:"Sin explorar"}).map(([type,label])=>(
          <div key={type} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#6b7280"}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:{urban:"#6b7280",wilderness:"#4ade80",indoor:"#a78bfa",underground:"#f87171",water:"#38bdf8",unknown:"#374151"}[type]}}/>
            {label}
          </div>
        ))}
        <div style={{fontSize:10,color:"#4b5563",marginLeft:"auto"}}>Scroll para zoom · Arrastra para mover</div>
      </div>
    </div>
  );
}

// ─── AUDIO ENGINE ────────────────────────────────────────────────────────────
const MOODS = {
  explore:  { label:"Exploración",  icon:"🌫️", color:"#60a5fa" },
  tense:    { label:"Tensión",      icon:"⚠️",  color:"#fbbf24" },
  combat:   { label:"Combate",      icon:"⚔️",  color:"#f87171" },
  rest:     { label:"Descanso",     icon:"🔥",  color:"#a78bfa" },
  danger:   { label:"Peligro",      icon:"☠️",  color:"#dc2626" },
  weather:  { label:"Tormenta",     icon:"⚡",  color:"#38bdf8" },
};

// Infiere el mood a partir del estado del juego
function inferMood(hp, maxHp, mapData, weather, needs, injuries){
  const danger   = mapData?.nodes?.[mapData?.currentZone]?.danger || 1;
  const zone     = mapData?.nodes?.[mapData?.currentZone];
  const isIndoor = zone?.type === "indoor" || zone?.type === "underground";
  const badWeather = ["tornado","acid_rain","electric","blizzard","heatstorm"].includes(weather?.id);
  const hpPct    = hp / (maxHp || 100);
  const hasGrave = injuries.some(i => i.severity >= 3);

  if(hpPct < 0.25 || hasGrave)            return "danger";
  if(badWeather && !isIndoor)             return "weather";
  if(danger >= 4)                         return "combat";
  if(danger >= 3 || hpPct < 0.5)         return "tense";
  if(isIndoor && needs.sleep > 60)        return "rest";
  return "explore";
}

// Clase AudioEngine — toda la síntesis procedural
class AudioEngine {
  constructor(){ this.ctx = null; this.nodes = {}; this.mood = null; this.vol = 0.4; this.enabled = false; }

  _ctx(){
    if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    return this.ctx;
  }

  // Master gain con fade
  _master(){
    if(!this.nodes.master){
      const g = this._ctx().createGain();
      g.gain.value = this.vol;
      g.connect(this._ctx().destination);
      this.nodes.master = g;
    }
    return this.nodes.master;
  }

  // Oscilador con fade in/out suave
  _osc(freq, type="sine", gainVal=0.08, detune=0){
    const ctx = this._ctx();
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + 3);
    osc.connect(g); g.connect(this._master());
    osc.start();
    return { osc, gain: g };
  }

  // Ruido blanco/rosa para ambiente
  _noise(gainVal=0.04, filterFreq=800, filterType="lowpass"){
    const ctx    = this._ctx();
    const bufLen = ctx.sampleRate * 2;
    const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data   = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<bufLen;i++){
      const wn = Math.random()*2-1;
      // Pink noise approx
      b0=0.99886*b0+wn*0.0555179; b1=0.99332*b1+wn*0.0750759;
      b2=0.96900*b2+wn*0.1538520; b3=0.86650*b3+wn*0.3104856;
      b4=0.55000*b4+wn*0.5329522; b5=-0.7616*b5-wn*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+wn*0.5362)*0.11;
      b6=wn*0.115926;
    }
    const src    = ctx.createBufferSource();
    src.buffer   = buf;
    src.loop     = true;
    const filter = ctx.createBiquadFilter();
    filter.type  = filterType;
    filter.frequency.value = filterFreq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + 3);
    src.connect(filter); filter.connect(g); g.connect(this._master());
    src.start();
    return { src, filter, gain: g };
  }

  // LFO para modulación lenta
  _lfo(target, minVal, maxVal, rateHz=0.05){
    const ctx = this._ctx();
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = rateHz;
    lfoG.gain.value = (maxVal - minVal) / 2;
    lfo.connect(lfoG);
    lfoG.connect(target);
    target.value = (minVal + maxVal) / 2;
    lfo.start();
    return lfo;
  }

  // Detiene todos los nodos con fade out
  _stopAll(fadeTime=2){
    const ctx = this._ctx();
    Object.values(this.nodes).forEach(n => {
      if(!n) return;
      const items = Array.isArray(n) ? n : [n];
      items.forEach(item => {
        try {
          if(item?.gain?.gain){
            item.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeTime);
            setTimeout(()=>{ try{ item.osc?.stop(); item.src?.stop(); item.lfo?.stop(); }catch(e){} }, fadeTime*1000+100);
          } else if(item?.stop){
            setTimeout(()=>{ try{ item.stop(); }catch(e){} }, fadeTime*1000+100);
          }
        } catch(e){}
      });
    });
    this.nodes = { master: this.nodes.master };
  }

  // ── MOODS ──────────────────────────────────────────────────────────────────

  _playExplore(){
    // Drones graves + viento suave + pulso lejano
    this.nodes.drone1 = this._osc(55,  "sine",    0.07);
    this.nodes.drone2 = this._osc(82.4,"sine",    0.05, 8);
    this.nodes.drone3 = this._osc(110, "triangle",0.03);
    this.nodes.wind   = this._noise(0.05, 600, "lowpass");
    this.nodes.lfo1   = this._lfo(this.nodes.drone1.gain.gain, 0.03, 0.09, 0.07);
    this.nodes.lfo2   = this._lfo(this.nodes.wind.filter.frequency,  400, 900, 0.03);
  }

  _playTense(){
    // Drones más altos + pulso rítmico + ruido mid
    this.nodes.drone1 = this._osc(73.4,"sawtooth", 0.04);
    this.nodes.drone2 = this._osc(110, "sine",     0.06);
    this.nodes.drone3 = this._osc(146.8,"triangle",0.03, -12);
    this.nodes.noise  = this._noise(0.06, 1200, "bandpass");
    // Pulso lento tipo corazón
    this._heartbeat(0.6, 0.06);
    this.nodes.lfo1   = this._lfo(this.nodes.drone1.gain.gain, 0.01, 0.07, 0.13);
  }

  _playCombat(){
    // Percusión industrial + drones disonantes + ruido alto
    this.nodes.drone1 = this._osc(55,  "sawtooth", 0.05);
    this.nodes.drone2 = this._osc(185, "sawtooth", 0.04, 15);
    this.nodes.noise  = this._noise(0.09, 2000, "highpass");
    this._heartbeat(0.35, 0.12);
    this.nodes.lfo1   = this._lfo(this.nodes.noise.filter.frequency, 1000, 3500, 0.4);
  }

  _playRest(){
    // Drones cálidos + crepitar fuego + graves suaves
    this.nodes.drone1 = this._osc(55,  "sine",    0.06);
    this.nodes.drone2 = this._osc(110, "sine",    0.04);
    this.nodes.fire   = this._noise(0.06, 400, "lowpass");
    this.nodes.lfo1   = this._lfo(this.nodes.drone1.gain.gain, 0.04, 0.08, 0.04);
    this.nodes.lfo2   = this._lfo(this.nodes.fire.filter.frequency, 200, 600, 0.08);
  }

  _playDanger(){
    // Drones graves muy bajos + ruido errático + latido rápido
    this.nodes.drone1 = this._osc(36.7,"sine",    0.09);
    this.nodes.drone2 = this._osc(55,  "sawtooth",0.05, 20);
    this.nodes.noise  = this._noise(0.10, 3000, "highpass");
    this._heartbeat(0.25, 0.15);
    this.nodes.lfo1   = this._lfo(this.nodes.noise.gain.gain, 0.04, 0.16, 0.7);
    this.nodes.lfo2   = this._lfo(this.nodes.drone1.gain.gain, 0.05, 0.13, 0.15);
  }

  _playWeather(){
    // Viento fuerte + interferencias eléctricas + drones metálicos
    this.nodes.wind1  = this._noise(0.12, 500, "lowpass");
    this.nodes.wind2  = this._noise(0.07, 2000, "bandpass");
    this.nodes.drone1 = this._osc(73.4,"sawtooth",0.04, 25);
    this.nodes.lfo1   = this._lfo(this.nodes.wind1.filter.frequency, 200, 1200, 0.18);
    this.nodes.lfo2   = this._lfo(this.nodes.wind2.gain.gain, 0.02, 0.12, 0.22);
  }

  // Latido de corazón sintético
  _heartbeat(interval, gainVal){
    const ctx = this._ctx();
    const beat = () => {
      if(!this.enabled || this._currentMoodFn !== this._heartbeatMood) return;
      const g = ctx.createGain();
      g.connect(this._master());
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = 80;
      osc.connect(g);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
      // Doble golpe
      setTimeout(()=>{
        const g2 = ctx.createGain(); g2.connect(this._master());
        const o2 = ctx.createOscillator(); o2.type="sine"; o2.frequency.value=70; o2.connect(g2);
        g2.gain.setValueAtTime(0,ctx.currentTime);
        g2.gain.linearRampToValueAtTime(gainVal*0.7, ctx.currentTime+0.02);
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
        o2.start(ctx.currentTime); o2.stop(ctx.currentTime+0.18);
      }, 120);
      this._beatTimer = setTimeout(beat, interval * 1000);
    };
    this._heartbeatMood = this._currentMoodFn;
    beat();
  }

  setVolume(v){
    this.vol = v;
    if(this.nodes.master) this.nodes.master.gain.linearRampToValueAtTime(v, this._ctx().currentTime + 0.5);
  }

  play(mood){
    if(!this.enabled) return;
    if(mood === this.mood) return;
    this.mood = mood;
    clearTimeout(this._beatTimer);
    this._stopAll(2.5);
    const fns = {
      explore: ()=>this._playExplore(),
      tense:   ()=>this._playTense(),
      combat:  ()=>this._playCombat(),
      rest:    ()=>this._playRest(),
      danger:  ()=>this._playDanger(),
      weather: ()=>this._playWeather(),
    };
    this._currentMoodFn = mood;
    setTimeout(()=>{ if(this.mood===mood && this.enabled) fns[mood]?.(); }, 2600);
  }

  enable(){
    this.enabled = true;
    if(this.ctx?.state === "suspended") this.ctx.resume();
    this.play(this.mood || "explore");
  }

  disable(){
    this.enabled = false;
    clearTimeout(this._beatTimer);
    this._stopAll(1.5);
    this.mood = null;
  }
}

const audioEngine = new AudioEngine();

// Hook para controlar el audio desde React
function useAudio(){
  const [enabled, setEnabled]           = React.useState(false);
  const [mood, setMood]                 = React.useState("explore");
  const [volume, setVolume]             = React.useState(0.4);
  const [manualOverride, setManualOverride] = React.useState(false);

  function toggle(){
    if(enabled){ audioEngine.disable(); setEnabled(false); setManualOverride(false); }
    else { audioEngine.enable(); setEnabled(true); }
  }

  // Llamado por el juego automáticamente — respeta el override
  function autoMood(m){
    if(manualOverride) return;
    setMood(m);
    audioEngine.play(m);
  }

  // Llamado por los botones manuales — activa override
  function changeMood(m){
    setMood(m);
    setManualOverride(true);
    audioEngine.play(m);
  }

  // Desactiva el override y vuelve a inferencia automática
  function releaseOverride(){
    setManualOverride(false);
  }

  function changeVolume(v){
    setVolume(v);
    audioEngine.setVolume(v);
  }

  return { enabled, mood, volume, manualOverride, toggle, autoMood, changeMood, releaseOverride, changeVolume };
}

  const [craftRecipe,setCraftRecipe] = useState(null); // {item, ingredients}
  const [mapData,setMapData] = useState({nodes:{},currentZone:""});

  function addToInventory(items, prev){
    const updated = [...prev];
    items.forEach(({name,qty=1})=>{
      const idx = updated.findIndex(i=>i.name===name);
      if(idx>=0) updated[idx]={...updated[idx],qty:(updated[idx].qty||1)+qty};
      else updated.push({name,qty});
    });
    return updated;
  }
  function removeFromInventory(items, prev){
    let updated = [...prev];
    items.forEach(({name,qty=1})=>{
      const idx = updated.findIndex(i=>i.name===name);
      if(idx>=0){
        const newQty=(updated[idx].qty||1)-qty;
        if(newQty<=0) updated=updated.filter((_,i)=>i!==idx);
        else updated[idx]={...updated[idx],qty:newQty};
      }
    });
    return updated;
  }

  // ─── DISEASE LOGIC ─────────────────────────────────────────────────────────
  function applyDiseaseEffects(currentDiseases, timeMins){
    if(!currentDiseases.length) return currentDiseases;
    const timeH = timeMins/60;
    let hpDelta=0, hungerDelta=0, thirstDelta=0, sleepDelta=0;
    const messages=[];
    const updated = currentDiseases.map(d=>{
      const def=DISEASE_DEFS[d.id]; if(!def) return d;
      const stg=def.stages[d.stage];
      hpDelta     += stg.hpPerAction * Math.max(1, timeH);
      hungerDelta += stg.hungerMod   * Math.max(1, timeH);
      thirstDelta += stg.thirstMod   * Math.max(1, timeH);
      sleepDelta  += stg.sleepMod    * Math.max(1, timeH);
      const newCount = d.actionCount+1;
      if(newCount >= def.progressEvery && d.stage < 2){
        const newStage = d.stage+1;
        messages.push({text:`⚠️ Tu ${def.label} ha empeorado: ahora está en estadio ${def.stages[newStage].label.toUpperCase()}. ${def.stages[newStage].desc}`, isPlayer:false});
        return {...d, stage:newStage, actionCount:0};
      }
      return {...d, actionCount:newCount};
    });
    if(hpDelta)     setHp(p=>Math.max(0,p+Math.round(hpDelta)));
    if(hungerDelta||thirstDelta||sleepDelta){
      setNeeds(p=>({
        ...p,
        hunger:Math.max(0,Math.min(100,p.hunger+hungerDelta)),
        thirst:Math.max(0,Math.min(100,p.thirst+thirstDelta)),
        sleep: Math.max(0,Math.min(100,p.sleep +sleepDelta)),
      }));
    }
    if(messages.length) setEntries(p=>[...p,...messages]);
    return updated;
  }

  function checkNaturalDiseases(currentDiseases, currentNeeds, currentInjuries, currentInventory, timeMins){
    let updated=[...currentDiseases];
    const msgs=[];
    const hasDisease=id=>updated.some(d=>d.id===id);
    const addDisease=id=>{
      if(!hasDisease(id)){
        updated.push({id,stage:0,actionCount:0});
        const def=DISEASE_DEFS[id];
        msgs.push({text:`🚨 Has contraído ${def.icon} ${def.label}. ${def.stages[0].desc}`,isPlayer:false});
      }
    };
    // Sleep = 0 → exhaustion
    if(currentNeeds.sleep<=0 && !hasDisease("exhaustion")) addDisease("exhaustion");
    // Injuries without antibiotics → wound infection chance (15% per action)
    const hasAntibiotics=currentInventory.some(i=>i.name==="Antibióticos"||i.name==="Botiquín completo");
    const infectionChance = selectedTraits.includes("inmunidad_natural") ? 0.07 : 0.15;
    if(currentInjuries.length>0 && !hasAntibiotics && !hasDisease("wound_infection") && Math.random()<infectionChance)
      addDisease("wound_infection");
    // Exhaustion cured by long rest (stage 0 only)
    if(hasDisease("exhaustion") && timeMins>=300){
      const ex=updated.find(d=>d.id==="exhaustion");
      if(ex&&ex.stage===0){
        updated=updated.filter(d=>d.id!=="exhaustion");
        msgs.push({text:"💤 El descanso prolongado ha curado tu agotamiento crónico.",isPlayer:false});
      }
    }
    // Fever cured by long rest (stage 0 only)
    if(hasDisease("fever") && timeMins>=480){
      const fv=updated.find(d=>d.id==="fever");
      if(fv&&fv.stage===0){
        updated=updated.filter(d=>d.id!=="fever");
        msgs.push({text:"💊 El descanso prolongado ha curado tu fiebre leve.",isPlayer:false});
      }
    }
    if(msgs.length) setEntries(p=>[...p,...msgs]);
    return updated;
  }

  function applyDiseasesUpdate(diseasesUpdate, currentDiseases){
    if(!diseasesUpdate?.length) return currentDiseases;
    let updated=[...currentDiseases];
    const msgs=[];
    diseasesUpdate.forEach(upd=>{
      const def=DISEASE_DEFS[upd.id]; if(!def) return;
      if(upd.action==="add"&&!updated.some(d=>d.id===upd.id)){
        updated.push({id:upd.id,stage:0,actionCount:0});
        msgs.push({text:`🚨 ${def.icon} Has contraído ${def.label}. ${def.stages[0].desc}`,isPlayer:false});
      } else if(upd.action==="remove"){
        if(updated.some(d=>d.id===upd.id)){
          updated=updated.filter(d=>d.id!==upd.id);
          msgs.push({text:`✅ Tu ${def.label} ha sido curada.`,isPlayer:false});
        }
      }
    });
    if(msgs.length) setEntries(p=>[...p,...msgs]);
    return updated;
  }

  function applyNeeds(result, timeMins, prevNeeds){
    const isGloton          = selectedTraits.includes("gloton");
    const isMetabolismoLento= selectedTraits.includes("metabolismo_lento");
    const isSediento        = selectedTraits.includes("sediento");
    const timeH = timeMins/60;
    // Automatic decay by time
    const hungerDecay = -(timeH*4*(isGloton?1.5:1)*(isMetabolismoLento?0.7:1));
    const thirstDecay = -(timeH*8*(isMetabolismoLento?0.7:1)*(isSediento?2:1));
    const sleepDecay  = -(timeH*3);
    const newNeeds = {
      hunger: Math.max(0,Math.min(100, prevNeeds.hunger + hungerDecay + (result.hungerChange||0))),
      thirst: Math.max(0,Math.min(100, prevNeeds.thirst + thirstDecay + (result.thirstChange||0))),
      sleep:  Math.max(0,Math.min(100, prevNeeds.sleep  + sleepDecay  + (result.sleepChange||0))),
      temp:   Math.max(32,Math.min(42, prevNeeds.temp   + (result.tempChange||0))),
    };
    setNeeds(newNeeds);
    // HP penalties from extreme needs
    if(newNeeds.hunger<10||newNeeds.thirst<10){
      setHp(p=>Math.max(0,p-5));
    }
    return newNeeds;
  }

  function applyChanges(result, curHp, curMaxHp, curNeeds){
    const mhp = curMaxHp??maxHp;
    setHp(Math.min(mhp,Math.max(0,(curHp??hp)+(result.hpChange||0))));
    const timeMins = result.timeMinutes||10;
    setGameTimeMinutes(p=>p+timeMins);
    applyNeeds(result, timeMins, curNeeds??needs);
    if(result.itemsGained?.length) setInventory(p=>addToInventory(result.itemsGained,p));
    if(result.itemsLost?.length)   setInventory(p=>removeFromInventory(result.itemsLost,p));
    setCraftRecipe(result.craftRecipe || null);
    // ── Aprender receta si la IA devuelve craftRecipe con éxito ──────────────
    if(result.craftRecipe?.item){
      const recipeName = result.craftRecipe.item;
      if(RECIPE_DB[recipeName]){
        setKnownRecipes(prev=>{
          if(prev.includes(recipeName)) return prev;
          setEntries(p=>[...p,{text:`📖 Receta aprendida: "${recipeName}" añadida a tu diario de crafteo.`,isPlayer:false}]);
          return [...prev, recipeName];
        });
      }
    }
    // ── Aprender recetas al leer libros ──────────────────────────────────────
    if(result.itemsGained?.length){
      result.itemsGained.forEach(({name})=>{
        const bookRecs = BOOK_RECIPES[name];
        if(bookRecs){
          setKnownRecipes(prev=>{
            const newOnes = bookRecs.filter(r=>!prev.includes(r));
            if(newOnes.length===0) return prev;
            setEntries(p=>[...p,{text:`📖 Al leer "${name}" aprendes ${newOnes.length} receta(s) nueva(s): ${newOnes.join(", ")}.`,isPlayer:false}]);
            return [...prev,...newOnes];
          });
        }
      });
    }
    // Diseases update (from AI)
    setDiseases(prev=>applyDiseasesUpdate(result.diseasesUpdate, prev));
    // Injuries update
    if(result.injuriesUpdate?.length){
      setInjuries(prev=>{
        let updated=[...prev];
        result.injuriesUpdate.forEach(upd=>{
          if(upd.action==="add"){
            const existing=updated.findIndex(i=>i.zone===upd.zone);
            if(existing>=0) updated[existing]={...updated[existing],severity:Math.max(updated[existing].severity,upd.severity),label:upd.label};
            else updated.push({zone:upd.zone,severity:upd.severity||1,label:upd.label||""});
          } else if(upd.action==="remove"){
            updated=updated.filter(i=>i.zone!==upd.zone);
          }
        });
        return updated;
      });
    }
    // Map update
    const mapUpd = result.mapUpdate || (result.location ? {
      currentZone: result.location,
      type: "urban",
      danger: 1,
      connections: []
    } : null);
    if(mapUpd){
      setMapData(prev=>{
        const updated={...prev,nodes:{...prev.nodes}};
        const {currentZone,connections=[],type="urban",danger=1}=mapUpd;
        if(!updated.nodes[currentZone]){
          const parentNode=updated.nodes[prev.currentZone];
          const baseX=parentNode?parentNode.x:400;
          const baseY=parentNode?parentNode.y:300;
          let x=baseX,y=baseY,attempts=0;
          do{
            const angle=Math.random()*Math.PI*2;
            x=baseX+Math.cos(angle)*130;
            y=baseY+Math.sin(angle)*130;
            attempts++;
          }while(attempts<8&&Object.values(updated.nodes).some(n=>Math.hypot(n.x-x,n.y-y)<90));
          updated.nodes[currentZone]={type,danger,visited:true,x,y,connections:[]};
        } else {
          updated.nodes[currentZone].visited=true;
          updated.nodes[currentZone].danger=danger;
        }
        connections.forEach(conn=>{
          if(!updated.nodes[currentZone].connections.includes(conn))
            updated.nodes[currentZone].connections.push(conn);
          if(!updated.nodes[conn]){
            const cx=updated.nodes[currentZone].x+(Math.random()-0.5)*180;
            const cy=updated.nodes[currentZone].y+(Math.random()-0.5)*180;
            updated.nodes[conn]={type:"unknown",danger:0,visited:false,x:cx,y:cy,connections:[currentZone]};
          } else {
            if(!updated.nodes[conn].connections.includes(currentZone))
              updated.nodes[conn].connections.push(currentZone);
          }
        });
        updated.currentZone=currentZone;
        return updated;
      });
    }
    // Skill XP
    if(result.skillXp && Object.keys(result.skillXp).length){
      setSkillXpMap(prev=>{
        const updated={...prev};
        const notifs=[];
        Object.entries(result.skillXp).forEach(([skill,gain])=>{
          if(ALL_SKILLS.includes(skill)&&gain>0){
            const old=updated[skill]||0;
            const oldLvl=xpToLvl(old);
            updated[skill]=old+gain*50;
            const newLvl=xpToLvl(updated[skill]);
            if(newLvl>oldLvl) notifs.push(`${skill} → Nivel ${newLvl}`);
          }
        });
        if(notifs.length){setLevelUpNotifs(notifs);setTimeout(()=>setLevelUpNotifs([]),3500);}
        return updated;
      });
    }
  }

  // ─── BASE LOGIC ──────────────────────────────────────────────────────────────
  const isAtBase = base.established && mapData.currentZone === base.location;

  function establishBase(){
    const zone = mapData.nodes[mapData.currentZone];
    if(!zone){ setEntries(p=>[...p,{text:"No puedes establecer un refugio aquí todavía.",isPlayer:false}]); return; }
    if(zone.danger > 2){ setEntries(p=>[...p,{text:"⚠️ Esta zona es demasiado peligrosa (peligro "+zone.danger+"). Necesitas una zona de peligro ≤ 2.",isPlayer:false}]); return; }
    setBase(prev=>({...prev, established:true, location:mapData.currentZone, name:"Refugio — "+mapData.currentZone, lastVisited:gameTimeMinutes}));
    setMapData(prev=>({...prev, nodes:{...prev.nodes, [mapData.currentZone]:{...prev.nodes[mapData.currentZone], isBase:true}}}));
    setEntries(p=>[...p,{text:"🏚️ Has establecido tu refugio en "+mapData.currentZone+". Este será tu hogar mientras dures en este mundo.",isPlayer:false}]);
  }

  function returnToBase(){
    if(!base.established){ setEntries(p=>[...p,{text:"No tienes ningún refugio establecido.",isPlayer:false}]); return; }
    const daysAway = Math.floor((gameTimeMinutes - base.lastVisited) / 1440);
    const msgs = [];
    let updatedBase = {...base, lastVisited:gameTimeMinutes};
    if(base.structures.includes("huerto") && daysAway >= 2){
      const foodGained = Math.floor(daysAway / 2);
      const ns = [...updatedBase.storage];
      for(let i=0;i<foodGained;i++){
        const idx=ns.findIndex(x=>x.name==="Lata de comida");
        if(idx>=0) ns[idx]={...ns[idx],qty:(ns[idx].qty||1)+1};
        else ns.push({name:"Lata de comida",qty:1});
      }
      updatedBase.storage = ns;
      msgs.push("🌱 Tu huerto produjo "+foodGained+" lata(s) de comida durante tu ausencia.");
    }
    if(!base.structures.includes("muro") && daysAway >= 3 && Math.random() < 0.4){
      const sc = [...updatedBase.storage];
      const lostCount = Math.min(sc.length, Math.floor(Math.random()*3)+1);
      const lost = [];
      for(let i=0;i<lostCount;i++){
        if(!sc.length) break;
        const idx=Math.floor(Math.random()*sc.length);
        lost.push(sc[idx].name); sc.splice(idx,1);
      }
      updatedBase.storage = sc;
      msgs.push("🚨 Tu refugio fue saqueado mientras estabas fuera. Perdiste: "+(lost.join(", ")||"algunos objetos")+". Construye un muro para protegerlo.");
    } else if(daysAway >= 1){
      msgs.push("🏚️ Llegas a tu refugio tras "+daysAway+" día(s) de ausencia. Todo parece estar en orden.");
    } else {
      msgs.push("🏚️ Llegas a tu refugio.");
    }
    if(base.structures.includes("cama")){
      setNeeds(p=>({...p, sleep:Math.min(100,p.sleep+40)}));
      msgs.push("🛏️ La cama de tu refugio te permite descansar bien. Sueño +40.");
    }
    setBase(updatedBase);
    setMapData(prev=>({...prev, currentZone:base.location}));
    setLocation(base.location);
    setGameTimeMinutes(p=>p+120);
    setEntries(p=>[...p,...msgs.map(text=>({text,isPlayer:false}))]);
  }

  function buildStructure(structId){
    const struct = BASE_STRUCTURES[structId];
    if(!struct) return;
    if(base.structures.includes(structId)){ setEntries(p=>[...p,{text:"Ya tienes "+struct.label+" construido.",isPlayer:false}]); return; }
    const skillLevel = xpToLvl(skillXpMap[struct.req.skill]||0);
    if(skillLevel < struct.req.level){
      setEntries(p=>[...p,{text:"❌ Necesitas "+struct.req.skill+" nivel "+struct.req.level+" para construir "+struct.label+". Tienes nivel "+skillLevel+".",isPlayer:false}]);
      return;
    }
    const missing = struct.mats.filter(mat=>!inventory.some(i=>i.name===mat));
    if(missing.length > 0){
      setEntries(p=>[...p,{text:"❌ Te faltan materiales para "+struct.label+": "+missing.join(", ")+".",isPlayer:false}]);
      return;
    }
    setInventory(p=>removeFromInventory(struct.mats.map(m=>({name:m,qty:1})),p));
    setBase(prev=>({...prev, structures:[...prev.structures, structId]}));
    setGameTimeMinutes(p=>p+120);
    setEntries(p=>[...p,{text:"🔨 Has construido "+struct.icon+" "+struct.label+" en tu refugio. "+struct.desc,isPlayer:false}]);
  }

  function depositItem(itemName){
    if(!inventory.find(i=>i.name===itemName)) return;
    setInventory(p=>removeFromInventory([{name:itemName,qty:1}],p));
    setBase(prev=>{
      const s=[...prev.storage];
      const idx=s.findIndex(i=>i.name===itemName);
      if(idx>=0) s[idx]={...s[idx],qty:(s[idx].qty||1)+1}; else s.push({name:itemName,qty:1});
      return {...prev,storage:s};
    });
  }

  function withdrawItem(itemName){
    if(!base.storage.find(i=>i.name===itemName)) return;
    setBase(prev=>({...prev,storage:removeFromInventory([{name:itemName,qty:1}],prev.storage)}));
    setInventory(p=>addToInventory([{name:itemName,qty:1}],p));
  }

  async function startGame(){
    const initSkills = buildInitialSkills();
    let initHp=100;
    if(selectedTraits.includes("robusto")) initHp+=20;
    if(selectedTraits.includes("debil"))   initHp-=20;
    const initItems = (CLASS_ITEMS[charClass.id]||[]).map(name=>({name,qty:1}));
    setSkillXpMap(initSkills); setHp(initHp); setMaxHp(initHp);
    setInventory(initItems); setScreen("game"); setLoading(true);
    // Trait: herido_previo — start with a random light injury
    if(selectedTraits.includes("herido_previo")){
      const zones = Object.keys(INJURY_ZONES);
      const rZone = zones[Math.floor(Math.random()*zones.length)];
      setInjuries([{zone:rZone, severity:1, label:"Herida antigua sin sanar"}]);
    }
    const traitNames=selectedTraits.map(tid=>TRAITS.find(t=>t.id===tid)?.label).filter(Boolean);
    const initNeeds={hunger:80,thirst:80,sleep:80,temp:36.5};
    setNeeds(initNeeds);
    // Recetas iniciales por clase

  // ─── WEATHER HELPERS ────────────────────────────────────────────────
  function pickWeather(){
    const totalWeight = Object.values(WEATHER_DEFINITIONS).reduce((s,w)=>s+w.weight,0);
    let r = Math.random()*totalWeight;
    for(const w of Object.values(WEATHER_DEFINITIONS)){
      if(r < w.weight) return w.id;
      r -= w.weight;
    }
    return "clear";
  }
  function generateWeather(){
    const id = pickWeather();
    const def = WEATHER_DEFINITIONS[id];
    const days = def.days ? def.days[Math.floor(Math.random()*def.days.length)] : 1;
    return { id, daysLeft: days };
  }
  // Build a coherent 5-day forecast as a sequence of weather IDs (one per upcoming day),
  // expanding multi-day events so the player sees what each day will look like.
  function buildForecast(currentWeather){
    const forecast = [];
    let pending = currentWeather ? { id: currentWeather.id, daysLeft: currentWeather.daysLeft } : null;
    // Skip current weather days, then generate upcoming
    if(pending) for(let d = 1; d < pending.daysLeft; d++) forecast.push(pending.id);
    while(forecast.length < 5){
      const next = generateWeather();
      for(let d = 0; d < next.daysLeft && forecast.length < 5; d++) forecast.push(next.id);
    }
    return forecast.slice(0,5);
  }
  const weatherMinuteAccum = useRef(0);
  function updateWeather(minutesElapsed){
    const mins = minutesElapsed || 10;
    weatherMinuteAccum.current += mins;
    const daysToTick = Math.floor(weatherMinuteAccum.current / 1440);
    if(daysToTick === 0) return;
    weatherMinuteAccum.current = weatherMinuteAccum.current % 1440;
    for(let t = 0; t < daysToTick; t++){
      setWeather(prev=>{
        if(prev.daysLeft > 1) return {...prev, daysLeft: prev.daysLeft - 1};
        const newW = generateWeather();
        setWeatherForecast(buildForecast(newW));
        return newW;
      });
    }
  }
  const ELECTRONIC_ITEMS = ["Radio walkie-talkie","Linterna","Reloj de pulsera"];

  function applyWeatherEffects(currentInventory, currentHistory){
    const def = WEATHER_DEFINITIONS[weather.id];
    if(!def) return;
    const zone = mapData.nodes[mapData.currentZone];
    const isOutdoor = !zone || (zone.type !== "indoor" && zone.type !== "underground");
    const inv = currentInventory || inventory;
    const hist = currentHistory || history;
    const messages = [];

    // ☢️ Lluvia ácida — daña HP al exterior y puede destruir ropa
    if(weather.id === "acid_rain"){
      if(isOutdoor){
        setHp(p=>Math.max(0,p-10));
        messages.push("☢️ La lluvia ácida cae sobre ti corroiendo tu piel. Pierdes 10 HP. Busca refugio o seguirá quemándote.");
        const clothingItems = inv.filter(i=>getItem(i.name).tags?.includes("clothing"));
        if(clothingItems.length > 0 && Math.random() < 0.4){
          const victim = clothingItems[Math.floor(Math.random()*clothingItems.length)];
          setInventory(p=>removeFromInventory([{name:victim.name,qty:1}],p));
          messages.push(`☢️ La lluvia ácida ha corroído y destruido tu ${victim.name}.`);
        }
      } else {
        messages.push("☢️ La lluvia ácida golpea el techo. Estás a salvo bajo cubierto por ahora.");
      }
    }

    // 🌪️ Tornado — penaliza si no buscas refugio activamente
    if(weather.id === "tornado"){
      const lastAction = (hist[hist.length-2]?.content||"").toLowerCase();
      const soughtShelter = ["refugio","cobijo","escondo","esconder","interior","dentro","cueva","edificio","sótano","sotano","bunker","cubierto"].some(w=>lastAction.includes(w));
      if(isOutdoor && !soughtShelter){
        const dmg = 15 + Math.floor(Math.random()*20);
        setHp(p=>Math.max(0,p-dmg));
        setNeeds(prev=>({...prev,hunger:Math.max(0,prev.hunger-8),thirst:Math.max(0,prev.thirst-8)}));
        messages.push(`🌪️ ¡El tornado te arrastra con fuerza brutal! Recibes ${dmg} HP de daño. Tu próxima acción DEBE ser buscar refugio.`);
        if(inv.length > 0 && Math.random() < 0.5){
          const lost = inv[Math.floor(Math.random()*inv.length)];
          setInventory(p=>removeFromInventory([{name:lost.name,qty:1}],p));
          messages.push(`🌪️ El viento te ha arrancado ${lost.name} de las manos.`);
        }
      } else {
        messages.push("🌪️ El tornado ruge afuera. Estás a salvo bajo cubierto. Espera a que pase antes de moverte.");
      }
    }

    // 🔥 Tormenta de calor — deshidratación acelerada y golpe de calor
    if(weather.id === "heatstorm"){
      setNeeds(prev=>{
        const newThirst = Math.max(0, prev.thirst - 12);
        const newTemp = Math.min(42, prev.temp + 1.5);
        if(newThirst < 20){
          setHp(p=>Math.max(0,p-8));
          messages.push("🔥 ¡Golpe de calor! La tormenta te deshidrata críticamente. Pierdes 8 HP. Bebe agua INMEDIATAMENTE.");
        } else {
          messages.push("🔥 El calor abrasador acelera tu deshidratación. Sed -12. Busca agua y sombra.");
        }
        return {...prev, thirst:newThirst, temp:newTemp};
      });
    }

    // 🌑 Tormenta de ceniza — penaliza Rastreo y Puntería con reducción de XP temporal
    if(weather.id === "ashstorm"){
      setSkillXpMap(prev=>{
        const updated={...prev};
        if(updated["Rastreo"] !== undefined) updated["Rastreo"] = Math.max(0, updated["Rastreo"] - 40);
        if(updated["Puntería"] !== undefined) updated["Puntería"] = Math.max(0, updated["Puntería"] - 40);
        return updated;
      });
      messages.push("🌑 La tormenta de ceniza lo cubre todo. Visibilidad casi nula — Rastreo y Puntería penalizados.");
      if(isOutdoor){
        setNeeds(prev=>({...prev, hunger:Math.max(0,prev.hunger-5)}));
        messages.push("🌑 Las cenizas en el aire dificultan respirar. El esfuerzo de moverte al exterior te agota más.");
      }
    }

    // ⚡ Tormenta eléctrica — destruye electrónicos o daña directamente
    if(weather.id === "electric"){
      const electronicsCarried = inv.filter(i=>ELECTRONIC_ITEMS.includes(i.name));
      if(isOutdoor && electronicsCarried.length > 0 && Math.random() < 0.45){
        const victim = electronicsCarried[Math.floor(Math.random()*electronicsCarried.length)];
        setInventory(p=>removeFromInventory([{name:victim.name,qty:1}],p));
        messages.push(`⚡ Un rayo impacta cerca y la descarga inutiliza tu ${victim.name} permanentemente.`);
      } else if(isOutdoor){
        const dmg = 5 + Math.floor(Math.random()*10);
        setHp(p=>Math.max(0,p-dmg));
        messages.push(`⚡ Una descarga eléctrica ambiental te sacude. Pierdes ${dmg} HP. Aléjate de zonas altas y estructuras metálicas.`);
      } else {
        messages.push("⚡ Los rayos caen sin parar. Bajo techo estás relativamente a salvo, pero no uses electrónicos.");
      }
    }

    // 🧊 Ventisca — hipotermia diferenciada según ropa de abrigo
    if(weather.id === "blizzard"){
      const hasWarmClothing = inv.some(i=>["Ropa de abrigo","Chaqueta de cuero"].includes(i.name));
      const dmg = hasWarmClothing ? 3 : 8;
      const tempDrop = hasWarmClothing ? -1.5 : -4;
      setHp(p=>Math.max(0,p-dmg));
      setNeeds(prev=>({...prev, temp:Math.max(32,prev.temp+tempDrop), hunger:Math.max(0,prev.hunger-6)}));
      if(hasWarmClothing){
        messages.push(`🧊 La ventisca es brutal pero tu ropa te protege algo. Pierdes ${dmg} HP y temperatura baja levemente.`);
      } else {
        messages.push(`🧊 La ventisca te congela sin protección. Pierdes ${dmg} HP y temperatura ${tempDrop}°C. ¡Consigue ropa de abrigo antes de que sea tarde!`);
      }
    }

    if(messages.length > 0){
      setEntries(prev=>[...prev,...messages.map(text=>({text,isPlayer:false}))]);
    }
  }

  async function takePhoto(sceneDesc, currentSceneImg, currentLocation){
    if(!currentSceneImg && !sceneDesc){
      setEntries(p=>[...p,{text:"📸 No hay nada que fotografiar aquí todavía.",isPlayer:false}]);
      return;
    }
    // Flash effect
    setShutterFlash(true);
    setTimeout(()=>setShutterFlash(false), 500);

    // Get or generate image
    let imgUrl = currentSceneImg;
    if(!imgUrl && sceneDesc) imgUrl = await fetchPollinationsImage(sceneDesc);
    if(!imgUrl){ setEntries(p=>[...p,{text:"📸 No pudiste sacar la foto.",isPlayer:false}]); return; }

    // Generate poetic caption via AI
    const dayNum = Math.floor(gameTimeMinutes/1440)+1;
    const timeStr = minutesToTime(gameTimeMinutes);
    let caption = `${currentLocation}, día ${dayNum}.`;
    try {
      const prompt =
        `Eres ${charName}, superviviente. Acabas de hacer una foto en: ${currentLocation}.\n`+
        `Escena: ${sceneDesc||"un lugar del mundo post-apocalíptico"}.\n`+
        `Escribe UNA frase corta (máx 18 palabras) como nota al pie de la foto — íntima, poética, en primera persona.\n`+
        `Solo la frase, sin comillas.`;
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_API_KEY}`},
        body:JSON.stringify({
          model:GROQ_MODEL, max_tokens:60, temperature:0.95,
          messages:[{role:"user",content:prompt}]
        })
      });
      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content?.trim()||"";
      if(raw) caption = raw.replace(/^["']|["']$/g,"");
    } catch(e){}

    const photo = {
      id: Date.now(),
      imageUrl: imgUrl,
      caption,
      location: currentLocation,
      dayNum,
      timeStr,
    };
    setPhotos(prev=>[...prev, photo]);
    setNewPhoto(true);
    setEntries(p=>[...p,{
      text:`📸 Foto guardada en tu álbum. "${caption}"`,
      isPlayer:false
    }]);
  }

  // ─── GENERATE DIARY ENTRY ──────────────────────────────────────────────────
  async function generateDiaryEntry(currentHistory, currentDiseases, currentInjuries,
                                     currentNeeds, currentHp, currentLocation, dayNum){
    // Collect last 4 narrative passages for context
    const recentNarrative = currentHistory
      .filter(m=>m.role==="assistant")
      .slice(-5)
      .map(m=>{ try{ return JSON.parse(m.content).narrative||""; }catch{ return ""; } })
      .join(" ")
      .slice(0,700);

    const diseasesStr = currentDiseases.length
      ? currentDiseases.map(d=>DISEASE_DEFS[d.id]?.label).filter(Boolean).join(", ")
      : "ninguna";
    const injuriesStr = currentInjuries.length
      ? currentInjuries.map(i=>i.label).join(", ")
      : "ninguna";

    const moodOptions = "feliz|triste|asustado|exhausto|enojado|esperanzado|reflexivo|neutro";
    const prompt =
      `Eres ${charName}, superviviente del día ${dayNum}. Acabas de dormirte.\n`+
      `Estado físico: Vida ${currentHp}/${maxHp}, Hambre ${Math.round(currentNeeds.hunger)}/100, `+
      `Sed ${Math.round(currentNeeds.thirst)}/100. Ubicación: ${currentLocation}.\n`+
      `Enfermedades: ${diseasesStr}. Heridas: ${injuriesStr}.\n`+
      `Lo que viviste hoy: ${recentNarrative}\n\n`+
      `Escribe UNA entrada de diario en primera persona. Íntima, breve (4-6 oraciones), `+
      `como alguien agotado escribiendo a la luz de una vela antes de dormir. `+
      `Menciona algo concreto de hoy. Sé honesto con el miedo, el cansancio o la esperanza según el estado físico. `+
      `Responde SOLO en JSON: {"text":"...entrada...","mood":"${moodOptions}"}`;

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_API_KEY}`},
        body:JSON.stringify({
          model: GROQ_MODEL,
          max_tokens:300,
          temperature:0.92,
          messages:[{role:"user",content:prompt}]
        })
      });
      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content?.trim()||"";
      const clean = raw.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      return { text: parsed.text||raw, mood: parsed.mood||"neutro" };
    } catch(e) {
      return null;
    }
  }

  async function triggerDiaryIfSleeping(timeMins, currentHistory, currentDiseases,
                                         currentInjuries, currentNeeds, currentHp, currentLoc){
    if(timeMins < 240) return; // only on long rest / sleep (>=4h)
    const dayNum = Math.floor(gameTimeMinutes / 1440) + 1;
    const timeStr = minutesToTime(gameTimeMinutes);
    const entry = await generateDiaryEntry(
      currentHistory, currentDiseases, currentInjuries,
      currentNeeds, currentHp, currentLoc, dayNum
    );
    if(!entry) return;
    const diaryEntry = {
      dayNum,
      timeStr,
      location: currentLoc,
      text: entry.text,
      mood: entry.mood,
      hp: currentHp,
      hunger: Math.round(currentNeeds.hunger),
      thirst: Math.round(currentNeeds.thirst),
      diseases: currentDiseases.map(d=>DISEASE_DEFS[d.id]?.label).filter(Boolean),
    };
    setDiary(prev=>[...prev, diaryEntry]);
    setNewDiaryEntry(true);
    setEntries(p=>[...p,{
      text:`📓 ${charName} escribe en su diario antes de dormir...`,
      isPlayer:false
    }]);
  }

    const action=input.trim(); setInput(""); setLoading(true);

    const photoKw=["saco una foto","hago una foto","fotografío","fotografio","tomo una foto","capturo esto","saco foto","polaroid","retrato","foto de"];
    if(photoKw.some(kw=>action.toLowerCase().includes(kw))){

      setLoading(false);
      return;
    }

    const userMsg={role:"user",content:action};

    const diseasesDesc = diseases.length ? diseases.map(d=>DISEASE_DEFS[d.id]?.label+"("+DISEASE_DEFS[d.id]?.stages[d.stage]?.label+")").join(", ") : "ninguna";
    const result=await callClaude(newHistory,charName,charClass.label,skillXpMap,traitNames,inventory,{...needs,diseasesDesc},weather,injuries,mapData,base,knownRecipes,narratorStyle,Math.floor(gameTimeMinutes/1440)+1);
    setHistory([...newHistory,{role:"assistant",content:JSON.stringify(result)}]);

        const imgData = await fetchPollinationsImage(result.sceneDescription);
        setSceneImg(imgData);
        setLocation(result.location||location);
      }
    const inventorySnapshot = [...inventory];
    const timeMins = result.timeMinutes||10;
    updateWeather(timeMins);
    applyChanges(result);
    applyWeatherEffects(inventorySnapshot, newHistory);
    // Disease tick: effects + natural contagion
    setDiseases(prev=>{
      const afterEffects = applyDiseaseEffects(prev, timeMins);
      return checkNaturalDiseases(afterEffects, needs, injuries, inventory, timeMins);
    });
    await triggerDiaryIfSleeping(timeMins, newHistory, diseases, injuries, needs, hp, location);
    // ── Trait: Adicto ──────────────────────────────────────────────────────────
    if(selectedTraits.includes("adicto")){
      const newCount = addictionCounter + 1;
      setAddictionCounter(newCount);
      if(newCount % 5 === 0){
        const hasDrug = inventory.some(i=>["Morfina","Alcohol","Botiquín completo"].includes(i.name));
        if(!hasDrug){
          setHp(p=>Math.max(0,p-10));
          setSkillXpMap(prev=>{
            const upd={...prev};
            ALL_SKILLS.forEach(s=>{ upd[s]=Math.max(0,(upd[s]||0)-80); });
            return upd;
          });
          setEntries(p=>[...p,{text:"😰 El síndrome de abstinencia te sacude. Pierdes 10 HP y tus habilidades se resienten gravemente. Consigue Morfina o Alcohol urgentemente.",isPlayer:false}]);
        } else {
          setEntries(p=>[...p,{text:"💉 Sientes el tirón de la adicción. Consumes tu dosis y el malestar cede por ahora.",isPlayer:false}]);
          setInventory(p=>removeFromInventory([{name:p.find(i=>["Morfina","Alcohol"].includes(i.name))?.name||"Morfina",qty:1}],p));
        }
      }
    }
    // ── Trait: Claustrofóbico ──────────────────────────────────────────────────
    if(selectedTraits.includes("claustrofobico")){
      const zone = mapData.nodes[mapData.currentZone];
      const isConfined = zone && (zone.type==="indoor"||zone.type==="underground");
      if(isConfined){
        setNeeds(p=>({...p, sleep:Math.max(0,p.sleep-8), hunger:Math.max(0,p.hunger-5)}));
        setEntries(p=>[...p,{text:"😱 Las paredes se cierran sobre ti. La claustrofobia te agota mentalmente. Sueño -8, Hambre -5.",isPlayer:false}]);
      }
    }
    // ── Trait: Paranoico ───────────────────────────────────────────────────────
    if(selectedTraits.includes("paranoico")){
      const newPCount = paranoiaCounter + 1;
      setParanoiaCounter(newPCount);
      if(newPCount % 5 === 0){
        const events = [
          {text:"👁️ Una sombra en el rabillo del ojo. Juras que alguien te sigue. Pierdes tiempo mirando atrás. Sueño -6.", sleep:-6},
          {text:"👁️ Escuchas pasos que no existen. El corazón se te dispara. El estrés te afecta físicamente. HP -5.", hp:-5},
          {text:"👁️ Convencido de que alguien movió tus cosas, pasas tiempo revisando tu inventario sin dormir. Sueño -5, Hambre -4.", sleep:-5, hunger:-4},
          {text:"👁️ La paranoia te hace dudar de cada elección. El estrés acumulado te consume por dentro. Hambre -6.", hunger:-6},
          {text:"👁️ Crees escuchar voces. Tardas horas en calmarte. HP -4, Sueño -5.", hp:-4, sleep:-5},
        ];
        const ev = events[Math.floor(Math.random()*events.length)];
        setEntries(p=>[...p,{text:ev.text,isPlayer:false}]);
        if(ev.hp)    setHp(p=>Math.max(0,p+ev.hp));
        if(ev.sleep||ev.hunger) setNeeds(p=>({...p, sleep:Math.max(0,p.sleep+(ev.sleep||0)), hunger:Math.max(0,p.hunger+(ev.hunger||0))}));
      }
    }
    setLoading(false);
  }

  // Fetch the image and return a data URL (base64) to avoid cross‑origin loading issues
  async function fetchPollinationsImage(desc){
    try {
      const url = pollinationsUrl(desc);
      const resp = await fetch(url);
      if(!resp.ok){
        console.error('Pollinations image fetch failed', resp.status);
        return '';
      }
      const blob = await resp.blob();
      return await new Promise((resolve)=>{
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    } catch(e){
      console.error('Error fetching Pollinations image', e);
      return '';
    }
  }

  // ─── QUICK ACTIONS ──────────────────────────────────────────────────────────
  function getQuickActions(){
    const danger   = mapData.nodes[mapData.currentZone]?.danger || 1;
    const isIndoor = ["indoor","underground"].includes(mapData.nodes[mapData.currentZone]?.type);
    const badWeather = !["clear"].includes(weather?.id);
    const hungerCrit = needs.hunger < 20;
    const thirstCrit = needs.thirst < 20;
    const sleepCrit  = needs.sleep  < 20;
    const hasInjury  = injuries.length > 0;
    const hasMeds    = inventory.some(i=>["Botiquín completo","Botiquín pequeño","Vendas x5","Morfina"].includes(i.name));
    const hasFood    = inventory.some(i=>getItem(i.name).tags?.includes("food"));
    const hasWater   = inventory.some(i=>getItem(i.name).tags?.includes("water"));

    // Necesidades críticas — máxima prioridad
    if(hungerCrit || thirstCrit || sleepCrit){
      const actions = [];
      const label = "🚨 Necesidades críticas";
      if(hungerCrit && hasFood)  actions.push({ icon:"🍖", text:"Comer algo de mi inventario" });
      if(hungerCrit && !hasFood) actions.push({ icon:"🍖", text:"Buscar comida urgentemente" });
      if(thirstCrit && hasWater) actions.push({ icon:"💧", text:"Beber agua de mi inventario" });
      if(thirstCrit && !hasWater)actions.push({ icon:"💧", text:"Buscar agua urgentemente" });
      if(sleepCrit)              actions.push({ icon:"😴", text:"Descansar donde pueda" });
      actions.push(              { icon:"🏥", text:"Buscar suministros médicos y comida" });
      return { label, actions: actions.slice(0,4) };
    }

    // Lesión activa
    if(hasInjury){
      const actions = [];
      const label = "🩹 Lesión activa";
      if(hasMeds) actions.push({ icon:"💊", text:"Curarme con los suministros que tengo" });
      else        actions.push({ icon:"🔍", text:"Buscar material médico para curar mis heridas" });
      actions.push({ icon:"🧵", text:"Vendarme las heridas para detener el sangrado" });
      actions.push({ icon:"😴", text:"Descansar para recuperarme" });
      actions.push({ icon:"🏥", text:"Buscar un lugar seguro para tratar mis heridas" });
      return { label, actions: actions.slice(0,4) };
    }

    // Clima extremo al exterior
    if(badWeather && !isIndoor){
      const wdef = WEATHER_DEFINITIONS[weather?.id];
      const actions = [
        { icon:"🏠", text:"Buscar refugio del "+wdef?.label?.toLowerCase() },
        { icon:"🚪", text:"Entrar en el edificio más cercano" },
        { icon:"⏳", text:"Esperar a que pase el temporal" },
        { icon:"🏃", text:"Correr hacia un lugar cubierto" },
      ];
      return { label:"⛈️ "+wdef?.label, actions };
    }

    // En la base
    if(isAtBase){
      const actions = [
        { icon:"🛏️", text:"Dormir para recuperar fuerzas" },
        { icon:"🍳", text:"Cocinar con lo que tengo en el almacén" },
        { icon:"🔧", text:"Reparar y revisar mi equipo" },
        { icon:"🌱", text:"Cuidar el huerto y los cultivos" },
      ];
      return { label:"🏚️ En tu refugio", actions };
    }

    // Zona peligrosa
    if(danger >= 3){
      const actions = [
        { icon:"👣", text:"Moverme con sigilo para evitar ser detectado" },
        { icon:"🏃", text:"Huir hacia una zona más segura" },
        { icon:"🔍", text:"Explorar con cuidado buscando recursos" },
        { icon:"🗡️", text:"Prepararme para el combate" },
      ];
      return { label:"⚠️ Zona peligrosa", actions };
    }

    // Exterior seguro — default
    const actions = [
      { icon:"🔍", text:"Explorar los alrededores en busca de recursos" },
      { icon:"🍖", text:"Buscar comida y agua" },
      { icon:"🗺️", text:"Reconocer el terreno y las zonas cercanas" },
      { icon:"😴", text:"Descansar un momento para recuperar energías" },
    ];
    return { label:"🌍 Exploración", actions };
  }
