        @keyframes slideLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#0d0b08}::-webkit-scrollbar-thumb{background:#3a2e1e;border-radius:2px}
        .noir-qa-btn:hover{border-color:#d4a843!important;color:#d4a843!important;background:#1e1810!important}
        .noir-qa-btn:active{transform:scale(0.97)}
        .noir-send:hover{background:#d4a843!important;color:#0d0b08!important}
        input::placeholder{color:#3a2e1e!important}
      `}</style>

      {levelUpNotifs.length>0&&(
        <div style={{position:"fixed",top:16,right:16,zIndex:999,display:"flex",flexDirection:"column",gap:6}}>
          {levelUpNotifs.map((n,i)=>(
            <div key={i} style={{background:"#0d0b08",color:accent,fontWeight:600,fontSize:11,padding:"8px 14px",borderRadius:2,border:`1px solid ${accent}`,animation:"fadeUp 0.4s ease",boxShadow:"0 4px 30px rgba(212,168,67,0.25)",letterSpacing:1,fontFamily:"'Cinzel',serif"}}>⬆ {n}</div>
          ))}
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"260px 1fr 210px",height:"100vh",width:"100%",maxWidth:1340,overflow:"hidden"}}>

        {/* ── LEFT PANEL ── */}
        <div style={{background:panel,borderRight:`1px solid ${bdr}`,padding:14,display:"flex",flexDirection:"column",gap:8,overflowY:"auto",height:"100vh"}}>

          {/* Character header */}
          <div style={{paddingBottom:10,borderBottom:`1px solid ${bdr}`}}>
            <div style={{fontSize:15,fontWeight:900,letterSpacing:2,fontFamily:"'Cinzel',serif",
              background:"linear-gradient(90deg, #d4a843 0%, #f5e0a0 40%, #d4a843 60%, #b8892a 100%)",
              backgroundSize:"200% auto",
              WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
              animation:"shimmer 4s linear infinite"}}>{charName}</div>
            <div style={{fontSize:8,color:noirMuted,letterSpacing:2.5,textTransform:"uppercase",marginTop:4,fontFamily:"'Cinzel',serif"}}>{charClass?.emoji} {charClass?.label}</div>
            <div style={{marginTop:8,fontSize:8,color:"#3a2e1e",letterSpacing:3,textAlign:"center",animation:"noirFlicker 12s infinite"}}>— ✦ —</div>
          </div>

          <HpBar hp={hp} maxHp={maxHp}/>

          {/* Body injuries map */}
          <div>
            <div style={sideT}>Lesiones</div>
            <BodyMap injuries={injuries}/>
            {injuries.length>0&&(
              <div style={{marginTop:4,display:"flex",flexDirection:"column",gap:2}}>
                {injuries.map((inj,i)=>(
                  <div key={i} style={{display:"flex",gap:5,alignItems:"center",fontSize:9,color:"#9ca3af"}}>
                    <span style={{width:6,height:6,borderRadius:"50%",background:SEV_COLOR[inj.severity],flexShrink:0,display:"inline-block"}}/>
                    <span style={{color:SEV_COLOR[inj.severity],fontWeight:700}}>{INJURY_ZONES[inj.zone]?.label}</span>
                    <span style={{color:"#6b7280"}}>— {inj.label}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Diseases */}
          <div>
            <div style={sideT}>Enfermedades</div>
            <DiseasePanel diseases={diseases}/>
          </div>

          {/* Needs */}
          <div>
            <div style={sideT}>Estado vital</div>
            <NeedsBar label="Hambre"      value={needs.hunger} color="#c97c3a" icon="🍖"/>
            <NeedsBar label="Sed"         value={needs.thirst} color="#4a7fa8" icon="💧"/>
            <NeedsBar label="Sueño"       value={needs.sleep}  color="#7a5c9e" icon="😴"/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginTop:4,padding:"3px 0",borderTop:`1px solid ${bdr}`}}>
              <span style={{color:noirMuted}}>🌡️ Temperatura</span>
              <span style={{color:needs.temp>38?"#c0392b":needs.temp<35?"#4a7fa8":"#6b8c5a",fontWeight:700}}>{needs.temp.toFixed(1)}°C</span>
            </div>
          </div>

          {/* Time */}
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,padding:"4px 0",borderBottom:`1px solid ${bdr}`}}>
            <span style={{color:noirMuted,letterSpacing:1}}>🕐 Hora</span>
            <span style={{color:accent,fontWeight:600,fontFamily:"'Cinzel',serif",fontSize:11}}>{timeDisplay}</span>
          </div>
          {/* Weather */}
          <div style={sideT}>Clima</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:13,color:noirText}}>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <span>{WEATHER_DEFINITIONS[weather?.id]?.icon || "☀️"}</span>
              <span style={{fontSize:11,color:noirText}}>{WEATHER_DEFINITIONS[weather?.id]?.label || "Despejado"}</span>
            </div>
            {weather?.daysLeft > 0 && (
              <span style={{fontSize:9,color:noirMuted,background:noirDim,border:`1px solid ${bdr}`,borderRadius:2,padding:"1px 6px",letterSpacing:1}}>
                {weather.daysLeft}d
              </span>
            )}
          </div>
          {inventory.some(i=>i.name==="Radio walkie-talkie") && weatherForecast.length>0 && (
            <div style={{marginTop:4}}>
              <div style={sideT}>📻 Pronóstico</div>
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                {weatherForecast.map((w,i)=>{
                  const wdef = WEATHER_DEFINITIONS[w];
                  const isExtreme = w !== "clear";
                  return (
                    <span key={i} title={wdef?.label||w} style={{fontSize:15,opacity:1-i*0.12,filter:isExtreme?"none":"opacity(0.6)"}}>
                      {wdef?.icon || "❓"}
                    </span>
                  );
                })}
              </div>
              <div style={{fontSize:9,color:"#4b5563",marginTop:2}}>próximos {weatherForecast.length} días</div>
            </div>
          )}
          {/* Skills */}
          <div>
            <div style={sideT}>Habilidades</div>
            <div style={{display:"flex",gap:4,marginBottom:7,flexWrap:"wrap"}}>
              {SKILL_TREE.map((cat,i)=>(
                <button key={i} onClick={()=>setActiveSkillCat(i)} title={cat.category} style={{fontSize:13,background:activeSkillCat===i?`${accent}18`:noirDim,border:`1px solid ${activeSkillCat===i?accent:bdr}`,borderRadius:2,padding:"3px 7px",cursor:"pointer",transition:"all 0.15s"}}>
                  {cat.icon}
                </button>
              ))}
            </div>
            <div style={{fontSize:8,color:"#4b5563",marginBottom:4,letterSpacing:1}}>{SKILL_TREE[activeSkillCat].category.toUpperCase()}</div>
            {SKILL_TREE[activeSkillCat].skills.map(sk=>{
              const penalized=injurySkillPenalty[sk]>0;
              return <SkillBar key={sk} name={sk} xp={effectiveSkillXpMap[sk]||0} accent={penalized?"#f87171":accent} dimmed={penalized}/>;
            })}
          </div>

          {/* Traits */}
          {selectedTraits.length>0&&(
            <div>
              <div style={sideT}>Rasgos</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                {selectedTraits.map(tid=>{
                  const t=TRAITS.find(x=>x.id===tid);
                  return <span key={tid} style={{fontSize:9,background:t.type==="pos"?"#1a2e14":"#2e1010",color:t.type==="pos"?"#7aaa5a":"#c05050",borderRadius:2,padding:"2px 6px",border:`1px solid ${t.type==="pos"?"#2d4a22":"#4a1a1a"}`,letterSpacing:0.5}}>{t.label}</span>;
                })}
              </div>
            </div>
          )}

          {/* Inventory */}
          <div style={{flexGrow:1}}>
            <div style={sideT}>Inventario</div>
            <CapBar used={usedKg} max={maxKg} unit="kg" color="#fb923c"/>
            <CapBar used={usedL}  max={maxL}  unit="L"  color="#38bdf8"/>
            <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3,maxHeight:160,overflowY:"auto"}}>
              {inventory.length===0
                ?<div style={{fontSize:10,color:"#374151"}}>Vacío</div>
                :inventory.map((item,i)=>{
                  const it=getItem(item.name);
                  const isHov = hoveredInvItem?.name===item.name;
                  return(
                    <div key={i}
                      onMouseEnter={e=>{const r=e.currentTarget.getBoundingClientRect();setHoveredInvItem({name:item.name,x:r.right+10,y:r.top});}}
                      onMouseLeave={()=>setHoveredInvItem(null)}
                      style={{fontSize:10,color:noirMuted,background:isHov?`${accent}12`:noirDim,border:`1px solid ${isHov?accent:bdr}`,borderRadius:2,padding:"3px 8px",display:"flex",justifyContent:"space-between",gap:4,borderLeft:`2px solid ${isHov?accent:accent+"33"}`,cursor:"default",transition:"all 0.15s"}}>
                      <span style={{color:noirText}}>▪ {item.name}{item.qty>1?` ×${item.qty}`:""}</span>
                      <span style={{color:noirMuted,whiteSpace:"nowrap",fontSize:9}}>{it.kg}kg</span>
                    </div>
                  );
                })
              }
            </div>
          </div>

          <button onClick={()=>setShowMap(true)} style={{background:"transparent",border:`1px solid ${accent}55`,color:accent,borderRadius:2,padding:"6px 10px",cursor:"pointer",fontSize:9,fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase",marginBottom:4,transition:"all 0.2s"}}>🗺️ Mapa</button>
          <button onClick={()=>{setShowAlbum(true);setNewPhoto(false);}} style={{background:newPhoto?`${accent}18`:"transparent",border:`1px solid ${newPhoto?accent:accent+"55"}`,color:accent,borderRadius:2,padding:"6px 10px",cursor:"pointer",fontSize:9,fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase",marginBottom:4,transition:"all 0.2s",display:"flex",alignItems:"center",gap:5,width:"100%",justifyContent:"center"}}>
            📸 Álbum {newPhoto&&<span style={{background:accent,color:"#0d0b08",borderRadius:"50%",width:14,height:14,fontSize:8,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontFamily:"sans-serif"}}>✦</span>}
          </button>
          <button onClick={()=>{setShowDiary(true);setNewDiaryEntry(false);}} style={{background:newDiaryEntry?`${accent}18`:"transparent",border:`1px solid ${newDiaryEntry?accent:accent+"55"}`,color:accent,borderRadius:2,padding:"6px 10px",cursor:"pointer",fontSize:9,fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase",marginBottom:4,transition:"all 0.2s",display:"flex",alignItems:"center",gap:5,width:"100%",justifyContent:"center"}}>
            📓 Diario {newDiaryEntry&&<span style={{background:accent,color:"#0d0b08",borderRadius:"50%",width:14,height:14,fontSize:8,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontFamily:"sans-serif"}}>✦</span>}
          </button>
          {/* Narrador activo */}
          {(()=>{ const n=NARRATOR_STYLES[narratorStyle]; return n?(
            <div style={{display:"flex",alignItems:"center",gap:5,fontSize:9,color:n.color,background:`${n.color}0d`,border:`1px solid ${n.color}33`,borderRadius:2,padding:"4px 8px",marginBottom:4}}>
              <span>{n.icon}</span><span style={{letterSpacing:1,fontFamily:"'Cinzel',serif"}}>{n.label}</span>
            </div>
          ):null; })()}
          <button onClick={()=>setShowCraftDiary(true)} style={{background:"transparent",border:`1px solid ${accent}55`,color:accent,borderRadius:2,padding:"6px 10px",cursor:"pointer",fontSize:9,fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase",marginBottom:4,display:"flex",alignItems:"center",gap:5,transition:"all 0.2s"}}>
            📖 Diario
            {knownRecipes.length>0&&<span style={{fontSize:7,background:`${accent}22`,border:`1px solid ${accent}44`,borderRadius:8,padding:"1px 5px"}}>{knownRecipes.length}</span>}
          </button>
          {base.established && (
            <button onClick={()=>setShowBase(true)} style={{background:isAtBase?"#0c1a0c":"transparent",border:`1px solid ${isAtBase?"#14532d":"#374151"}`,color:isAtBase?"#4ade80":"#6b7280",borderRadius:7,padding:7,cursor:"pointer",fontSize:10,fontFamily:"inherit",marginBottom:4}}>
              🏚️ {isAtBase?"En tu refugio":"Refugio: "+base.location}
              {base.structures.length>0&&<span style={{marginLeft:4,fontSize:9,color:"#4b5563"}}>({base.structures.length} mejoras)</span>}
            </button>
          )}
          <MusicPanel audio={audio} accent={accent} bdr={bdr}/>
          {/* Indicador de autoguardado */}
          {lastSaved && (
            <div style={{display:"flex",alignItems:"center",gap:4,fontSize:8,color:saveNotif?"#7aaa5a":noirMuted,letterSpacing:1,transition:"color 0.4s"}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:saveNotif?"#7aaa5a":noirMuted,display:"inline-block",transition:"background 0.4s"}}/>
              {saveNotif ? "Guardado" : `Guardado ${new Date(lastSaved).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}`}
            </div>
          )}
          <button onClick={()=>{ if(window.confirm("¿Abandonar la partida actual? Se borrará el progreso guardado.")) resetGame(); }}
            style={{background:"transparent",border:`1px solid ${bdr}`,color:noirMuted,borderRadius:2,padding:"6px 10px",cursor:"pointer",fontSize:9,fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase",marginTop:4}}>↺ Nueva partida</button>
        </div>

        {/* ── CENTER PANEL ── */}
        <div style={{display:"flex",flexDirection:"column",background:bg,height:"100vh",overflow:"hidden",
          boxShadow:"inset 1px 0 0 #2c221822, inset -1px 0 0 #2c221822"}}>
          <div ref={scrollRef} style={{flexGrow:1,overflowY:"auto",padding:"20px 22px",display:"flex",flexDirection:"column",gap:14,minHeight:0}}>
            {entries.map((e,i)=>(
              e.isPlayer
                ? <div key={i} style={{alignSelf:"flex-end",maxWidth:"76%",animation:"slideRight 0.28s cubic-bezier(0.2,0,0,1)"}}>
                    <div style={{fontSize:7,color:"#4a3a22",textAlign:"right",marginBottom:4,letterSpacing:2,textTransform:"uppercase",fontFamily:"'Cinzel',serif"}}>— tú</div>
                    <div style={{background:"#150f08",borderTop:`1px solid ${bdr}`,borderBottom:`1px solid ${bdr}`,borderRight:`2px solid ${accent}88`,borderLeft:`1px solid ${bdr}`,padding:"9px 14px",fontSize:12.5,lineHeight:1.75,color:"#a89060",fontStyle:"italic",letterSpacing:0.2}}>{e.text}</div>
                  </div>
                : <div key={i} style={{alignSelf:"flex-start",maxWidth:"90%",animation:"slideLeft 0.32s cubic-bezier(0.2,0,0,1)"}}>
                    <div style={{borderLeft:`2px solid ${accent}`,paddingLeft:14,background:"linear-gradient(135deg,#0f0c07,#110e09)",padding:"13px 16px 13px 16px",fontSize:13.5,lineHeight:1.9,color:"#d6c49a",borderRadius:"0 2px 2px 0",marginLeft:0,
                      borderTop:`1px solid ${bdr}44`,borderBottom:`1px solid ${bdr}44`,borderRight:`1px solid ${bdr}22`}}>{e.text}</div>
                  </div>
            ))}
            {loading&&<div style={{display:"flex",gap:5,padding:"8px 0",alignItems:"center"}}>
              {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:accent,opacity:0.8,animation:`bounce 1.4s ${i*0.25}s infinite`}}/>)}
              <span style={{fontSize:9,color:noirMuted,letterSpacing:2,marginLeft:4,fontFamily:"'Cinzel',serif",textTransform:"uppercase"}}>Narrando...</span>
            </div>}
          </div>
          <div style={{padding:"10px 16px 12px",borderTop:`1px solid ${bdr}`,display:"flex",flexDirection:"column",gap:8}}>

            {/* Acciones rápidas */}
            {!loading && (
              <div>
                <div style={{fontSize:8,color:noirMuted,letterSpacing:2.5,textTransform:"uppercase",marginBottom:6,fontFamily:"'Cinzel',serif"}}>{quickCtx.label}</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {quickCtx.actions.map((a,i)=>(
                    <button key={i} onClick={()=>sendQuickAction(a.text)} className="noir-qa-btn"
                      style={{fontSize:10,background:noirDim,border:`1px solid ${bdr}`,color:noirMuted,borderRadius:2,padding:"5px 11px",cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
                      <span style={{fontSize:12}}>{a.icon}</span><span>{a.text}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Botones de base */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {!base.established && (
                <button onClick={establishBase} style={{fontSize:9,background:"#0f1208",border:"1px solid #2d4a22",color:"#7aaa5a",borderRadius:2,padding:"4px 10px",cursor:"pointer",fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase"}}>🏚️ Establecer refugio</button>
              )}
              {base.established && !isAtBase && (
                <button onClick={returnToBase} style={{fontSize:9,background:`${accent}12`,border:`1px solid ${accent}55`,color:accent,borderRadius:2,padding:"4px 10px",cursor:"pointer",fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase"}}>🏚️ Volver al refugio</button>
              )}
              {isAtBase && (
                <button onClick={()=>setShowBase(true)} style={{fontSize:9,background:"#0f1208",border:"1px solid #2d4a22",color:"#7aaa5a",borderRadius:2,padding:"4px 10px",cursor:"pointer",fontFamily:"'Cinzel',serif",letterSpacing:1,textTransform:"uppercase"}}>🏚️ Gestionar refugio</button>
              )}
            </div>

            {/* Input */}
            <div style={{display:"flex",gap:10}}>
              <input style={{flex:1,background:noirDim,border:"none",borderBottom:`1px solid ${accent}66`,padding:"10px 6px",color:noirText,fontFamily:"'IM Fell English',Georgia,serif",fontSize:13,outline:"none",fontStyle:"italic"}}
                placeholder="¿Qué haces?…"
                value={input} onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&sendAction()} disabled={loading}/>
              <button onClick={sendAction} disabled={loading} style={{background:"transparent",color:loading?noirMuted:accent,border:`1px solid ${loading?bdr:accent}`,borderRadius:2,padding:"10px 18px",cursor:loading?"not-allowed":"pointer",fontWeight:600,fontFamily:"'Cinzel',serif",fontSize:11,whiteSpace:"nowrap",letterSpacing:2,textTransform:"uppercase",transition:"all 0.2s"}}>Enviar</button>
            </div>
          </div>
        </div>

        {/* ── RIGHT PANEL ── */}
        <div style={{background:panel,borderLeft:`1px solid ${bdr}`,padding:14,display:"flex",flexDirection:"column",gap:10,overflowY:"auto",height:"100vh"}}>
          <div style={sideT}>Escena</div>
          <div style={{position:"relative",background:"#080604",border:`1px solid ${bdr}`,overflow:"hidden",minHeight:150}}>
            {sceneImg
              ?<div style={{overflow:"hidden",height:155}}>
                  <img src={sceneImg} alt="scene"
                    style={{width:"100%",display:"block",filter:"sepia(25%) contrast(1.08) brightness(0.92)",
                      animation:"kenBurns 18s ease-in-out infinite alternate",transformOrigin:"center center"}}/>
                </div>
              :<div style={{height:155,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}>
                  <div style={{fontSize:18,opacity:0.3,animation:"critPulse 2s ease-in-out infinite"}}>◈</div>
                  <div style={{color:noirMuted,fontSize:8,letterSpacing:3,fontFamily:"'Cinzel',serif",textTransform:"uppercase"}}>Cargando escena…</div>
                </div>
            }
            <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.85))",padding:"20px 8px 6px"}}>
              <div style={{color:accent,fontSize:9,letterSpacing:1.5,fontFamily:"'Cinzel',serif",textTransform:"uppercase"}}>📍 {location}</div>
            </div>
          </div>

          {/* Craft recipe panel */}
          {craftRecipe&&(
            <div style={{background:noirDim,border:`1px solid ${accent}44`,borderLeft:`2px solid ${accent}`,padding:"10px 12px"}}>
              <div style={{fontSize:9,color:accent,letterSpacing:2,textTransform:"uppercase",marginBottom:6,fontFamily:"'Cinzel',serif"}}>🔨 {craftRecipe.item}</div>
              <div style={{fontSize:8,color:noirMuted,marginBottom:5,letterSpacing:1,textTransform:"uppercase"}}>Materiales</div>
              {craftRecipe.ingredients.map((ing,i)=>{
                const have=inventory.some(item=>item.name.toLowerCase().includes(ing.toLowerCase()));
                return(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:10,marginBottom:4}}>
                    <span style={{color:have?"#7aaa5a":"#c05050",fontSize:11}}>{have?"✓":"✗"}</span>
                    <span style={{color:have?noirText:noirMuted,fontStyle:"italic"}}>{ing}</span>
                  </div>
                );
              })}
              {RECIPE_DB[craftRecipe.item] && !knownRecipes.includes(craftRecipe.item) && (
                <div style={{marginTop:7,paddingTop:6,borderTop:`1px solid ${bdr}44`,fontSize:9,color:accent,fontStyle:"italic"}}>
                  ✦ Completa el crafteo para guardar esta receta en tu diario
                </div>
              )}
            </div>
          )}

          <div style={{marginTop:"auto"}}>
            <div style={{textAlign:"center",fontSize:8,color:"#3a2e1e",letterSpacing:3,marginBottom:6,animation:"noirFlicker 10s infinite"}}>— ✦ —</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:8,color:noirMuted,letterSpacing:1,fontFamily:"'Cinzel',serif"}}>{entries.filter(e=>e.isPlayer).length} acciones</span>
              <span style={{fontSize:7,color:"#2c2218"}}>Pollinations AI</span>
            </div>
          </div>
        </div>

      </div>
      {showMap&&<MapModal mapData={mapData} accent={accent} onClose={()=>setShowMap(false)}/>}
      {showBase&&<BaseModal base={base} inventory={inventory} skillXpMap={skillXpMap} accent={accent} bdr={bdr} onClose={()=>setShowBase(false)} onBuild={buildStructure} onDeposit={depositItem} onWithdraw={withdrawItem}/>}
      {showCraftDiary&&<CraftDiaryModal knownRecipes={knownRecipes} inventory={inventory} skillXpMap={skillXpMap} accent={accent} bdr={bdr} onClose={()=>setShowCraftDiary(false)} onCraft={craftFromDiary}/>}
      {showDiary&&<DiaryModal diary={diary} charName={charName} accent={accent} bdr={bdr} onClose={()=>setShowDiary(false)}/>}
      {showAlbum&&<AlbumModal photos={photos} charName={charName} accent={accent} bdr={bdr} onClose={()=>setShowAlbum(false)}/>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<AIDungeon />);
</script>
</body>
</html>
